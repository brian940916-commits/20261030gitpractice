<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Template</title>
  </head>
<body>
	<h1>List Students from table</h1>
	<form method="get" action="/student/add">
  		<button type="submit">Add</button>
	</form>
	<table>
	<tr>
		<td>流水號</td>
		<td>學號</td>
		<td>姓名</td>
	</tr>
	{% for p in students %}
	<tr>
		<td>
  			{{ loop.index }}:
  			<a href="/student/edit/{{ p.stuid }}">Edit</a>
		</td>
		<td>{{ p.stuid }} </td>
		<td>{{ p.name }}</td>
		<td>
			<form method="post" action="/student/delete/{{ p.stuid }}" style="display:inline">
    			<button type="submit">刪除</button>
  			</form>
		</td>
	</tr>
	{% endfor %}
	</table>
</body>
</html>
